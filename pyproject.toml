[project]
name = "appsec-triage-mcp"
version = "0.1.0"
description = "MCP server for AppSec scanners, code tools, Git projects and result delivery"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]

[project.scripts]
appsec-mcp = "appsec_triage_mcp.server:main"
appsec-scan-projects = "appsec_triage_mcp.client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["appsec_triage_mcp*"]

[tool.setuptools.package-data]
"appsec_triage_mcp.core" = ["assets/**/*"]
"appsec_triage_mcp.core.sca.lang" = ["builtins/*.txt"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/appsec_triage_mcp/core"]
